<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIENTES</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('cli.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .container {
            margin-top: 85px;
        }
        .col-md-6 {
            margin-left: 215px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 mt-5">
                <h2 class="text-center">DATOS DEL CLIENTE</h2>
                <form action="clientes.php" method="POST">
                    <div class="form-group">
                        <label>Id cliente</label>
                        <input type="number" name="idCliente" class="form-control" required maxlength="10" placeholder="Escriba el id del cliente">
                    </div>
                    <div class="form-group">
                        <label>Nombre del cliente</label>
                        <input type="text" name="Nomcli" class="form-control" required maxlength="25" placeholder="Escriba el nombre del cliente">
                    </div>
                    <div class="form-group">
                        <label>Direccion del cliente</label>
                        <input type="text" name="Direccion" class="form-control" required maxlength="30" placeholder="Escriba la direccion del cliente">
                    </div>
                    <div class="form-group">
                        <label>Telefono del cliente</label>
                        <input type="number" name="Numtel" class="form-control" required maxlength="10" placeholder="Escriba el telefono del cliente">
                    </div>
                    <div class="form-group">
                        <label>Fecha de registro</label>
                        <input type="date" name="Fechareg" class="form-control" required maxlength="10">
                    </div>
                    <div class="form-group">
                        <label>Sexo</label>
                        <select name="Sexocli" class="form-control">
                            <option value="H">Hombre</option>
                            <option value="M">Mujer</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
