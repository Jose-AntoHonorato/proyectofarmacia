<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('regi.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .register-form {
            width: 300px;
            margin: 0 auto;
            margin-top: 100px;
            border: 1px solid #000;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px #000;
        }
        .register-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .register-form form {
            display: flex;
            flex-direction: column;
        }
        .register-form form input[type="text"], .register-form form input[type="password"], .register-form form input[type="submit"] {
            margin-bottom: 20px;
            padding: 10px;
        }
        .register-form form input[type="submit"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="register-form">
        <h2>Registro de usuario</h2>
        <form action="nuevousuario.php" method="POST">
            <label>Usuario</label>
            <input type="text" name="newUser" required maxlength="10" placeholder="Escriba el nombre del nuevo usuario">
            <label>Contraseña</label>
            <input type="password" name="newPass" required maxlength="10" placeholder="Escriba la nueva contraseña">
            <input type="submit" value="Registrar">
        </form>
    </div>
</body>
</html>
