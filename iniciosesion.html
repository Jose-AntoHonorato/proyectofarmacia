<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('ini.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .login-form {
            width: 300px;
            margin: 0 auto;
            margin-top: 100px;
            border: 1px solid #000;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px #000;
        }
        .login-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-form form {
            display: flex;
            flex-direction: column;
        }
        .login-form form input[type="text"], .login-form form input[type="password"], .login-form form input[type="submit"] {
            margin-bottom: 20px;
            padding: 10px;
        }
        .login-form form input[type="submit"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-form">
        <h2>Farmacia San Pablo</h2>
        <form action="validar.php" method="POST">
            <label>Usuario</label>
            <input type="text" name="usuario" required maxlength="10" placeholder="Escriba su usuario">
            <label>Contraseña</label>
            <input type="password" name="pass" required maxlength="10" placeholder="Escriba su contraseña">
            <input type="submit" value="Enviar">
        </form>
        <form action="registrarusuario.html" method="POST">
            <input type="submit" value="Registrar nuevo usuario">
        </form>
		<a href="documentacion.pdf">Ver documentación de la BD</a>

    </div>
</body>
</html>
