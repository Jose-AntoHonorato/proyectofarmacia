<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            background-image: url('men.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            font-family: Arial, sans-serif;
        }
        .menu {
            width: 300px;
            margin: 0 auto;
            margin-top: 100px;
            border: 1px solid #000;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px #000;
        }
        .menu h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .menu form {
            display: flex;
            flex-direction: column;
        }
        .menu form select, .menu form input[type="submit"], .menu form input[type="reset"] {
            margin-bottom: 20px;
            padding: 10px;
        }
        .menu form input[type="submit"], .menu form input[type="reset"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h2>Farmacia san pablo</h2>
        <form action="" method="POST">
            <label>Bienvenido al sistema, ¿qué desea hacer?</label>
            <select name="Registros" onchange="this.form.action = this.value + '.html';">
                <option value=""></option>
                <option value="registrar">Dar de alta registros</option>
                <option value="busqueda">Busqueda de registros</option>
            </select>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpiar">
        </form>
    </div>
</body>
</html>
